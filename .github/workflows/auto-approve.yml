name: auto-approve
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
jobs:
  approve:
    if: startsWith(github.head_ref, 'catalog/')
    runs-on: ubuntu-latest
    steps:
      - name: approve with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr review ${{ github.event.pull_request.number }} -R ${{ github.repository }} --approve -b "sandbox auto-approve"
      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: enable auto-merge with the App token
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh pr merge ${{ github.event.pull_request.number }} -R ${{ github.repository }} --auto --rebase
